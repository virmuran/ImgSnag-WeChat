# Gradle 全局配置

# 构建用的 JVM 参数。Chaquopy 打包 Python 标准库时会吃内存，1G 不够
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 用 AndroidX（本项目其实一个 AndroidX 库都没引，写上是防以后加库时踩坑）
android.useAndroidX=true
android.nonTransitiveRClass=true

# 配置缓存：Chaquopy 对它的支持不完整，开了可能报一些看不懂的错。
# 构建时间本来就不长（几分钟），不值得为它冒险 —— 保持关闭。
# org.gradle.configuration-cache=true
