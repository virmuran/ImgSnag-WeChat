# 在 GitHub 的服务器上编译安卓 APK
#
# ── 为什么要放云上编译，而不是本机 ──
# 本机是 Windows，而安卓打包链是标准的 Linux 工具链：JDK + Android SDK + NDK +
# Gradle，全下来 2GB 起步，配好还得半小时。GitHub 的 ubuntu 运行器**已经预装好了**
# 这一整套（JDK 17、Android SDK 平台 36、build-tools 36、NDK），
# 公开仓库还免费用、不限量。所以这里一行 apt 都不用装。
#
# ── 怎么用 ──
#   发版：在 GitHub 上 Publish 一个正式版本 Release（vX.Y.Z，先传好 exe 和便携 zip）——
#         本工作流自动构建并把 APK 补进这个 Release，三种形态并排出现
#   手动：仓库页面 → Actions → 左侧 "Build Android APK" → Run workflow
#         （只出构建记录底部的 artifact，不碰 Release）
#
#   ⚠ 推送代码**不再**自动构建。曾经每次推送都把 APK 刷到 Releases 的 apk-latest
#     滚动预发布位，但预发布对所有人可见，等于把下载入口弄成两个 —— 已取消；
#     安卓应用内更新改读正式发布位（与桌面版同源）。
#
# ── 为什么自己下载 Gradle ──
# Chaquopy 17.0.0 官方配套的是 Gradle 8.13，版本不对会报很难懂的错。
# 运行器镜像自带的是 Gradle 9.x，而且镜像本身还会换底（2026-10 起迁 Ubuntu 26）——
# 依赖镜像里"恰好有什么"太脆，直接下载钉死的 8.13，一步到位。

name: Build Android APK

on:
  workflow_dispatch:               # 手动：只出 artifact，不碰 Release
  release:
    types: [published]             # 正式发版：把 APK 补进那个 Release

permissions:
  contents: write                  # 需要它才能把 APK 挂到 Release

# 同一分支连推两次时，把前一次还没跑完的取消掉，别白烧时间
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 防套娃：apk-latest 预发布位已取消，但旧的那个 Release 可能还没删干净，
    # 万一它被手动 Publish 成正式发布，不能再触发一轮"给它发版"
    if: github.event_name != 'release' || github.event.release.tag_name != 'apk-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 17 要求**构建机上的 Python 主次版本与应用完全一致**（这里是 3.12），
      # 差一个小版本就直接失败。运行器自带的 python3 恰好是 3.12，
      # 但还是先用 setup-python 钉死，免得哪天镜像换了版本我们被动跟进。
      - name: 装 Python 3.12（Chaquopy 打包用）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 确认构建用的 Python 版本
        run: |
          python3 -V
          if command -v python3.12 >/dev/null 2>&1; then
            python3.12 -V
          elif [ "$(python3 -c 'import sys;print("%d.%d" % sys.version_info[:2])')" = "3.12" ]; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python3.12
            echo "已把 python3 软链为 python3.12"
          else
            echo "::error::构建机上没有 Python 3.12 —— Chaquopy 要求构建 Python 与应用主次版本一致"
            exit 1
          fi

      # 先跑一遍本地就能跑的那部分测试。它会在几秒内拦住两类问题：
      # 副本忘了同步（APK 里会是旧规则）、Python 桥接层被改坏。
      # 比等五分钟打包完才发现划算得多。
      # pyyaml 让测试能连工作流文件本身的语法一起校验（失败也不拦路）。
      - name: 快速自检（副本同步 + 桥接层）
        run: |
          python3 -m pip install --user pyyaml -q 2>/dev/null || true
          python3 tests/test_apk_app.py

      - name: 接受 SDK 许可并补齐所需组件
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "--- 已安装的相关组件 ---"
          "$SDKMANAGER" --list_installed 2>/dev/null | grep -Ei "platforms;android-3|build-tools;3" || true

      # 密钥读不出来是最难查的一类失败（报错是 "keystore password was incorrect"，
      # 让人以为是密码写错了，其实是格式不被这个 JDK 支持）。
      # 所以在这里先单独验一次，失败了立刻停，报错信息明确。
      - name: 预检签名密钥（JDK 能否读取）
        working-directory: android-apk
        run: |
          keytool -list -keystore keystore/imgsnag.p12 -storetype PKCS12 \
                  -storepass imgsnag -alias imgsnag

      # 不用镜像自带的 Gradle（9.x）生成 wrapper —— 依赖镜像环境太脆，
      # 直接下载钉死的 8.13（与 Chaquopy 17.0.0 官方 demo 配套）。
      - name: 安装 Gradle 8.13
        run: |
          curl -fsSL --retry 3 -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.13/bin/gradle --version

      - name: 编译 release APK
        working-directory: android-apk
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 读取版本号并整理产物名
        id: pack
        run: |
          VER=$(grep -oP 'VERSION\s*=\s*"\K[^"]+' version.py | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          SRC=android-apk/app/build/outputs/apk/release/app-release.apk
          OUT="ImgSnag_${VER}_android_arm64.apk"
          mv "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      # 这一步是替代"在电脑上装一遍试试"的。没有真机可测，
      # 就用能机器判定的方式确认关键东西真的进了包：
      #   ① 签名有效（无效的 APK 手机根本装不上）
      #   ② Python 运行时在（缺了会一打开就闪退，而且体积上看不出来）
      #   ③ 清单/版本/图标 —— 用 aapt2 badging 判定。
      #     ⚠ 不能按 res 文件名找图标：release 构建会优化资源路径，
      #     "unzip 列表里有没有 ic_launcher"不可靠（实测 0 命中，其实图标好好的）。
      - name: 验包（签名 + 运行时 + 代码）
        run: |
          set -u
          APK="${{ steps.pack.outputs.apk }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)
          APKSIGNER="$BT/apksigner"
          AAPT2="$BT/aapt2"

          echo "=== ① 签名 ==="
          "$APKSIGNER" verify --print-certs "$APK"

          echo "=== ② 包内容 ==="
          unzip -l "$APK" > /tmp/contents.txt
          ARMV8=$(grep -c "lib/arm64-v8a/" /tmp/contents.txt || true)
          PYLIB=$(grep -c "libpython3" /tmp/contents.txt || true)
          CHQ=$(grep -c "assets/chaquopy/" /tmp/contents.txt || true)
          echo "arm64 原生库 $ARMV8 个 / libpython $PYLIB 个 / chaquopy 资源 $CHQ 条"
          grep -E "libpython3|imgsnag" /tmp/contents.txt | head -10 || true

          echo "=== ③ 清单与图标 ==="
          "$AAPT2" dump badging "$APK" > /tmp/badging.txt
          grep -E "^package:|application-label:|sdkVersion|targetSdkVersion" /tmp/badging.txt
          ICON=$(grep -c "application-icon" /tmp/badging.txt || true)
          echo "图标档位数 $ICON"

          fail=0
          [ "$ARMV8" -gt 0 ] || { echo "::error::APK 里没有 arm64 原生库"; fail=1; }
          [ "$PYLIB" -gt 0 ] || { echo "::error::APK 里没有 libpython —— Chaquopy 没生效，装上也打不开"; fail=1; }
          [ "$CHQ"  -gt 0 ]  || { echo "::error::APK 里没有 chaquopy 资源目录"; fail=1; }
          [ "$ICON" -gt 0 ]  || { echo "::error::APK 里没有启动图标"; fail=1; }
          grep -q "^package: name='com.virmuran.imgsnag'" /tmp/badging.txt \
            || { echo "::error::包名不是 com.virmuran.imgsnag"; fail=1; }
          exit $fail

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ImgSnag-APK-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.apk }}
          if-no-files-found: error

      # 正式发版（Publish 一个 vX.Y.Z 的 Release，exe 和便携 zip 已在里面）时触发：
      # 把刚构建好的 APK 也塞进同一个 Release —— 三种形态并排，下载入口永远只有那一页。
      - name: 把 APK 补进本次版本 Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "${{ steps.pack.outputs.apk }}" --clobber
          echo "已把 ${{ steps.pack.outputs.apk }} 附加到 Release $TAG"
